name: build
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew :${{ matrix.minecraft }}:build
      - uses: actions/upload-artifact@v7
        with:
          name: jar-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/safari-contest-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/test-results/test/TEST-*.xml
          if-no-files-found: error
  build:
    if: always()
    needs: target
    runs-on: ubuntu-24.04
    steps:
      - name: Require all Minecraft targets to pass
        env:
          TARGET_RESULT: ${{ needs.target.result }}
        run: test "$TARGET_RESULT" = success
